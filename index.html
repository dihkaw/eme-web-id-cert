<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Sertifikasi — EME</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.js"></script>
<style>
  :root {
    --primary: #1a56db;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --success: #059669;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #1a56db);
    color: #fff;
    padding: 2rem 1rem;
    text-align: center;
  }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: .5px; }
  header p { margin-top: .35rem; opacity: .85; font-size: .95rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 1.5rem;
  }

  /* ---------- TABLE VIEW ---------- */
  .search-bar { margin-bottom: 1rem; }
  .search-bar input {
    width: 100%;
    padding: .65rem .9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
  }
  .search-bar input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .7rem .8rem; text-align: left; white-space: nowrap; }
  thead th {
    background: #f8fafc;
    border-bottom: 2px solid var(--border);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr:hover { background: #f0f6ff; }
  td.qr-cell { text-align: center; }
  td.qr-cell canvas { width: 44px !important; height: 44px !important; }
  .badge {
    display: inline-block;
    padding: .2rem .55rem;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 600;
  }
  .badge.jce { background: #dbeafe; color: #1d4ed8; }
  .badge.joa { background: #dcfce7; color: #15803d; }
  .empty { text-align: center; color: var(--muted); padding: 2rem; }

  /* ---------- DETAIL VIEW ---------- */
  .verify-box { max-width: 560px; margin: 0 auto; text-align: center; }
  .verify-box .status {
    display: inline-block;
    padding: .45rem 1.4rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 1.2rem;
  }
  .status.valid { background: #d1fae5; color: var(--success); }
  .status.expired { background: #fee2e2; color: var(--danger); }
  .verify-box h2 { font-size: 1.5rem; margin-bottom: .25rem; }
  .verify-box .skill { color: var(--muted); font-size: 1rem; margin-bottom: 1.25rem; }
  .qr-box {
    display: inline-block;
    padding: 1rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 1rem 0;
  }
  .qr-box canvas { width: 180px !important; height: 180px !important; }
  .meta { text-align: left; margin-top: 1.2rem; }
  .meta .row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .95rem;
  }
  .meta .row:last-child { border-bottom: none; }
  .meta .label { color: var(--muted); }
  .meta .value { font-weight: 600; text-align: right; word-break: break-all; }
  .back-link { display: inline-block; margin-top: 1.5rem; color: var(--primary); text-decoration: none; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }
  .notfound { text-align: center; padding: 3rem 1rem; }
  .notfound h2 { color: var(--danger); margin-bottom: .5rem; }
</style>
</head>
<body>
<header>
  <h1>EME — Verifikasi Sertifikasi</h1>
  <p>Periksa keaslian sertifikat kompetensi</p>
</header>
<main>
  <div id="app"><div class="empty">Memuat data…</div></div>
</main>

<script>
const BASE_URL = "https://eme.web.id/cert/";
const app = document.getElementById("app");

async function loadData() {
  const res = await fetch("/data.json");
  if (!res.ok) throw new Error("Gagal memuat data.json");
  return res.json();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTable(data) {
  const rows = data.map(c => `
    <tr data-id="${escapeHtml(c.id)}">
      <td>${escapeHtml(c.id)}</td>
      <td>${escapeHtml(c.nama)}</td>
      <td><span class="badge ${escapeHtml(c.cert)}">${escapeHtml(c.skill)}</span></td>
      <td>${escapeHtml(c.issue)}</td>
      <td>${escapeHtml(c.valid)}</td>
      <td class="qr-cell"><canvas data-qrcode="${BASE_URL + escapeHtml(c.id)}"></canvas></td>
    </tr>`).join("");

  app.innerHTML = `
    <div class="card">
      <div class="search-bar">
        <input type="text" id="search" placeholder="Cari berdasarkan ID, nama, atau skill…" autocomplete="off">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>ID</th><th>Name</th><th>Skill</th><th>Date Issue</th><th>Valid Until</th><th>QR</th>
          </tr></thead>
          <tbody id="tbody">${rows}</tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none">Tidak ada data ditemukan.</div>
      </div>
    </div>`;

  // Render QR per row
  document.querySelectorAll("canvas[data-qrcode]").forEach(el => {
    QRCode.toCanvas(el, el.dataset.qrcode, { width: 88, margin: 0 });
  });

  // Row click -> detail page
  document.querySelectorAll("#tbody tr").forEach(tr => {
    tr.addEventListener("click", () => {
      history.pushState({}, "", "/cert/" + tr.dataset.id);
      route(data);
    });
  });

  // Search filter
  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    let visible = 0;
    document.querySelectorAll("#tbody tr").forEach(tr => {
      const show = tr.textContent.toLowerCase().includes(q);
      tr.style.display = show ? "" : "none";
      if (show) visible++;
    });
    document.getElementById("emptyMsg").style.display = visible ? "none" : "block";
  });
}

function isValid(cert) {
  const v = new Date(cert.valid);
  return v >= new Date(new Date().toDateString());
}

function renderDetail(data, id) {
  const c = data.find(x => x.id === id);
  if (!c) {
    app.innerHTML = `
      <div class="card notfound">
        <h2>Sertifikat Tidak Ditemukan</h2>
        <p>ID <strong>${escapeHtml(id)}</strong> tidak terdaftar dalam database.</p>
        <a class="back-link" href="/">&larr; Kembali ke daftar</a>
      </div>`;
    return;
  }
  const valid = isValid(c);
  app.innerHTML = `
    <div class="card verify-box">
      <span class="status ${valid ? "valid" : "expired"}">${valid ? "VALID" : "EXPIRED"}</span>
      <h2>${escapeHtml(c.nama)}</h2>
      <div class="skill">${escapeHtml(c.skill)}</div>
      <div class="qr-box"><canvas id="qr"></canvas></div>
      <div class="meta">
        <div class="row"><span class="label">Certificate ID</span><span class="value">${escapeHtml(c.id)}</span></div>
        <div class="row"><span class="label">Date Issue</span><span class="value">${escapeHtml(c.issue)}</span></div>
        <div class="row"><span class="label">Valid Until</span><span class="value">${escapeHtml(c.valid)}</span></div>
        <div class="row"><span class="label">Assessor</span><span class="value">${escapeHtml(c.assessorname)}<br><small style="font-weight:400;color:var(--muted)">${escapeHtml(c.assessorjob)}</small></span></div>
        <div class="row"><span class="label">Verification URL</span><span class="value">${BASE_URL}${escapeHtml(c.id)}</span></div>
      </div>
      <a class="back-link" href="/">&larr; Kembali ke daftar sertifikat</a>
    </div>`;
  QRCode.toCanvas(document.getElementById("qr"), BASE_URL + c.id, { width: 360, margin: 1 });
}

function route(data) {
  const path = location.pathname.replace(/\/+$/, "");
  const m = path.match(/^\/cert\/([^/]+)$/i);
  if (m) renderDetail(data, decodeURIComponent(m[1]));
  else renderTable(data);
}

window.addEventListener("popstate", async () => {
  try { route(await loadData()); } catch (e) { app.innerHTML = `<div class="empty">${e.message}</div>`; }
});

(async () => {
  try {
    const data = await loadData();
    route(data);
    document.title = location.pathname.includes("/cert/") ? "Verifikasi Sertifikat" : "Verifikasi Sertifikasi — EME";
  } catch (e) {
    app.innerHTML = `<div class="card empty">${escapeHtml(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
